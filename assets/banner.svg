<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="1Huy — Software Engineer, Cloud and AI-augmented engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="55%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#061a1c"/>
    </linearGradient>
    <radialGradient id="glowL" cx="22%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#179fa3" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#179fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#22c3c9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#179fa3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5eead4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.2" fill="#5eead4" fill-opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }

      .trace { fill: none; stroke: #179fa3; stroke-opacity: .22; stroke-width: 1.5; }
      .pulse { fill: none; stroke: #5eead4; stroke-width: 2.2; stroke-linecap: round;
               stroke-dasharray: 26 600; animation: flow 5s linear infinite; filter: url(#soft); }
      .pulse.p2 { animation-duration: 6.5s; animation-delay: -2s; stroke: #38bdf8; }
      .pulse.p3 { animation-duration: 4.2s; animation-delay: -1s; }
      .pulse.p4 { animation-duration: 7s; animation-delay: -3.5s; stroke: #38bdf8; }
      @keyframes flow { from { stroke-dashoffset: 626; } to { stroke-dashoffset: 0; } }

      .node { fill: #0a1220; stroke: #5eead4; stroke-width: 1.5; }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

      .in { opacity: 0; animation: in .5s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .8s; }
      .t1 { animation-delay: 1.0s; } .t2 { animation-delay: 1.5s; }
      .t3 { animation-delay: 2.1s; } .t4 { animation-delay: 2.6s; }
      .t5 { animation-delay: 3.2s; } .t6 { animation-delay: 3.7s; }

      .cursor { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0; } }

      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(380px); } }

      .tag rect { fill: #0b1a22; stroke: #179fa3; stroke-opacity: .55; }
      .tag text { fill: #a5f3fc; font-size: 13px; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowL)"/>
    <rect width="1200" height="340" fill="url(#glowR)"/>

    <!-- circuit traces -->
    <path id="c1" class="trace" d="M0 300 H180 L210 270 H420 L450 300 H640"/>
    <path id="c2" class="trace" d="M0 40 H120 L150 70 H330 L360 40 H560"/>
    <path id="c3" class="trace" d="M640 340 V312 L668 300 H1200"/>
    <path id="c4" class="trace" d="M560 40 H600 L620 20 H1200"/>
    <use href="#c1" class="pulse"/>
    <use href="#c2" class="pulse p2"/>
    <use href="#c3" class="pulse p3"/>
    <use href="#c4" class="pulse p4"/>
    <circle class="node blink" cx="210" cy="270" r="4"/>
    <circle class="node blink" cx="450" cy="300" r="4" style="animation-delay:.6s"/>
    <circle class="node blink" cx="150" cy="70"  r="4" style="animation-delay:1.1s"/>
    <circle class="node blink" cx="360" cy="40"  r="4" style="animation-delay:.3s"/>
    <circle class="node blink" cx="668" cy="300" r="4" style="animation-delay:.9s"/>

    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#edge)" opacity=".35"/>

    <!-- ============ LEFT: identity ============ -->
    <g class="in d1">
      <text x="72" y="112" class="mono" font-size="16" fill="#5eead4" fill-opacity=".85">&gt; hello_world() // I'm</text>
    </g>
    <g class="in d2">
      <text x="66" y="198" class="sans" font-size="104" font-weight="800" letter-spacing="-2" fill="url(#name)" filter="url(#glow)">1Huy</text>
    </g>
    <g class="in d3">
      <text x="72" y="236" class="sans" font-size="19" font-weight="500" fill="#c9d1d9">Software Engineer
        <tspan fill="#179fa3"> · </tspan>Cloud &amp; Infrastructure
        <tspan fill="#179fa3"> · </tspan>AI-Augmented</text>

      <g class="tag mono">
        <rect x="72"  y="256" width="70"  height="26" rx="6"/><text x="107" y="274" text-anchor="middle">AWS</text>
        <rect x="150" y="256" width="92"  height="26" rx="6"/><text x="196" y="274" text-anchor="middle">Node.js</text>
        <rect x="250" y="256" width="134" height="26" rx="6"/><text x="317" y="274" text-anchor="middle">System Design</text>
        <rect x="392" y="256" width="104" height="26" rx="6"/><text x="444" y="274" text-anchor="middle">AI Agents</text>
      </g>
    </g>

    <!-- ============ RIGHT: terminal ============ -->
    <g transform="translate(680 58)">
      <rect x="0" y="0" width="460" height="226" rx="12" fill="#070d17" fill-opacity=".92" stroke="#1e3a44"/>
      <rect x="0" y="0" width="460" height="226" rx="12" fill="none" stroke="#5eead4" stroke-opacity=".12" stroke-width="6" filter="url(#soft)"/>
      <path d="M0 12 a12 12 0 0 1 12 -12 H448 a12 12 0 0 1 12 12 V34 H0 Z" fill="#0d1726"/>
      <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
      <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
      <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
      <text x="230" y="22" text-anchor="middle" class="mono" font-size="12" fill="#6b7f93">1huy@cloud: ~/career</text>

      <g class="mono" font-size="14.5">
        <g class="in t1"><text x="20" y="66"><tspan fill="#5eead4">❯</tspan><tspan fill="#e6edf3"> whoami</tspan></text></g>
        <g class="in t2"><text x="20" y="88" fill="#8b9bb0">software_engineer <tspan fill="#38bdf8">@</tspan> vietnam</text></g>

        <g class="in t3"><text x="20" y="120"><tspan fill="#5eead4">❯</tspan><tspan fill="#e6edf3"> cat stack.yml</tspan></text></g>
        <g class="in t4"><text x="20" y="142" fill="#8b9bb0">[ nestjs, postgres, docker, <tspan fill="#febc2e">aws</tspan> ]</text></g>

        <g class="in t5"><text x="20" y="174"><tspan fill="#5eead4">❯</tspan><tspan fill="#e6edf3"> ./career --next</tspan></text></g>
        <g class="in t6">
          <text x="20" y="196" fill="#5eead4">→ solution_architect</text>
          <rect class="cursor" x="196" y="183" width="9" height="17" fill="#5eead4"/>
        </g>
      </g>
    </g>

    <!-- bottom edge -->
    <rect x="0" y="338" width="1200" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#5eead4" stroke-opacity=".15"/>
</svg>
