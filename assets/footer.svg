<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#179fa3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5eead4" stroke-opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="frame"><rect width="1200" height="110" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .trace { fill: none; stroke: #179fa3; stroke-opacity: .22; stroke-width: 1.5; }
      .pulse { fill: none; stroke: #5eead4; stroke-width: 2.2; stroke-linecap: round;
               stroke-dasharray: 26 700; animation: flow 6s linear infinite; filter: url(#soft); }
      .pulse.r { animation-direction: reverse; stroke: #38bdf8; }
      @keyframes flow { from { stroke-dashoffset: 726; } to { stroke-dashoffset: 0; } }
      .cursor { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { fill-opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="110" fill="url(#bg)"/>
    <rect width="1200" height="110" fill="url(#grid)"/>
    <path id="l" class="trace" d="M0 55 H260 L290 30 H420"/>
    <path id="r" class="trace" d="M1200 55 H940 L910 80 H780"/>
    <use href="#l" class="pulse"/>
    <use href="#r" class="pulse r"/>
    <text x="600" y="62" text-anchor="middle" class="mono" font-size="16">
      <tspan fill="#5eead4">❯</tspan><tspan fill="#e6edf3"> exit</tspan><tspan fill="#6b7f93">  // thanks for stopping by </tspan><tspan class="cursor" fill="#5eead4">█</tspan>
    </text>
    <rect x="0" y="0" width="1200" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="109" rx="18" fill="none" stroke="#5eead4" stroke-opacity=".15"/>
</svg>
